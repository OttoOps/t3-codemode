name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - deploy/**

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the Cargo.toml version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: t3cm-${{ needs.version.outputs.version }}-${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET" --bin t3cm
      - name: Locate the binary
        run: |
          case "$TARGET" in
            *-windows-*) echo "BIN=target/$TARGET/release/t3cm.exe" >> "$GITHUB_ENV" ;;
            *) echo "BIN=target/$TARGET/release/t3cm" >> "$GITHUB_ENV" ;;
          esac
      - name: The binary runs and reports the version
        if: matrix.target != 'x86_64-apple-darwin'
        run: test "$("$BIN" --version)" = "t3cm $VERSION"
      - name: The cross-built binary is x86_64
        if: matrix.target == 'x86_64-apple-darwin'
        run: test "$(lipo -archs "$BIN")" = x86_64
      - name: Package
        env:
          COPYFILE_DISABLE: "1"
        run: |
          mkdir -p "dist/$ARCHIVE"
          cp "$BIN" README.md LICENSE "dist/$ARCHIVE/"
          case "$TARGET" in
            *-linux-*) cp deploy/t3-codemode.service "dist/$ARCHIVE/" ;;
          esac
          cd dist
          case "$TARGET" in
            *-windows-*) 7z a -tzip "$ARCHIVE.zip" "$ARCHIVE" ;;
            *) tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}.*
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: t3cm-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum t3cm-*.tar.gz t3cm-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  attest:
    name: attest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
            --generate-notes dist/*

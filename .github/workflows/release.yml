name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - skills/**
      - deploy/**
      - .github/scripts/fake_releases.py

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the Cargo.toml version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: t3cm-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --profile dist --locked --target "$TARGET" --bin t3cm
      - name: Locate the binary
        run: |
          case "$TARGET" in
            *-windows-*) echo "BIN=target/$TARGET/dist/t3cm.exe" >> "$GITHUB_ENV" ;;
            *) echo "BIN=target/$TARGET/dist/t3cm" >> "$GITHUB_ENV" ;;
          esac
      - name: The binary runs and reports the version
        if: matrix.target != 'x86_64-apple-darwin'
        run: test "$("$BIN" --version)" = "t3cm $VERSION"
      - name: The cross-built binary is x86_64
        if: matrix.target == 'x86_64-apple-darwin'
        run: test "$(lipo -archs "$BIN")" = x86_64
      - name: macOS signing happens on tags
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/v')
        run: echo "::notice title=macOS signing skipped::$ARCHIVE holds an unsigned binary. The sign-macos job signs and notarizes the macOS builds on v* tags only, in the release environment."
      - name: Package
        env:
          COPYFILE_DISABLE: "1"
        run: |
          mkdir -p "dist/$ARCHIVE"
          cp "$BIN" README.md LICENSE "dist/$ARCHIVE/"
          case "$TARGET" in
            *-linux-*) cp deploy/t3-codemode.service "dist/$ARCHIVE/" ;;
            *-apple-darwin) cp deploy/com.ottoops.t3-codemode.plist "dist/$ARCHIVE/" ;;
            *-windows-*) cp deploy/install.ps1 "dist/$ARCHIVE/" ;;
          esac
          cd dist
          case "$TARGET" in
            *-windows-*) 7z a -tzip "$ARCHIVE.zip" "$ARCHIVE" ;;
            *) tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ (endsWith(matrix.target, '-apple-darwin') && startsWith(github.ref, 'refs/tags/v')) && 'unsigned-' || '' }}${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}.*
          if-no-files-found: error

  sign-macos:
    name: sign (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    environment: release
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: t3cm-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-${{ env.ARCHIVE }}
          path: dist
      - name: Unpack the archive
        working-directory: dist
        run: |
          tar -xzf "$ARCHIVE.tar.gz"
          rm "$ARCHIVE.tar.gz"
          echo "BIN=$PWD/$ARCHIVE/t3cm" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
      - name: Check for the macOS signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_PRIVATE_KEY DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::a release must hold signed macOS binaries; the release environment is missing: ${missing[*]}"
            exit 1
          fi
      - name: Import the Developer ID identity into a temporary keychain
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$KEYCHAIN"
          keychain_password=$(openssl rand -base64 32)
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/developer-id.p12"
          umask 077
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          search=("$keychain")
          while read -r existing; do
            search+=("$existing")
          done < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "${search[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -v team="($APPLE_TEAM_ID)" '/"Developer ID Application: / && index($0, team) { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::the .p12 holds no valid Developer ID Application identity for team $APPLE_TEAM_ID"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Codesign with the hardened runtime
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --timestamp --options runtime \
            --identifier com.ottoops.t3cm \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          details=$(codesign --display --verbose=2 "$BIN" 2>&1)
          echo "$details"
          grep -q '^Authority=Developer ID Application: ' <<< "$details"
          grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$details"
          grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\(runtime\)' <<< "$details"
      - name: Notarize
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$APPSTORE_KEY_ID.p8"
          zip="$RUNNER_TEMP/$ARCHIVE-notarize.zip"
          (umask 077 && printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$key")
          ditto -c -k --keepParent "$BIN" "$zip"
          set +e
          xcrun notarytool submit "$zip" --key "$key" --key-id "$APPSTORE_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID" --wait --timeout 30m --output-format json \
            > "$RUNNER_TEMP/notarize.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/notarize.json"
          id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/notarize.json" || true)
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$RUNNER_TEMP/notarize.json" || true)
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" --key "$key" --key-id "$APPSTORE_KEY_ID" \
              --issuer "$APPSTORE_ISSUER_ID" || true
          fi
          rm -f "$key" "$zip"
          if [ "$rc" -ne 0 ] || [ "$status" != Accepted ]; then
            echo "::error::notarization of $BIN ended with status '${status:-unknown}' (notarytool exit $rc)"
            exit 1
          fi
          echo "Notarization $id: Accepted"
      - name: Gatekeeper accepts the notarized binary
        run: |
          for attempt in $(seq 10); do
            if spctl --assess --type open --context context:primary-signature --ignore-cache --no-cache \
                --verbose=2 "$BIN" 2> "$RUNNER_TEMP/spctl.txt" \
              && grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"; then
              cat "$RUNNER_TEMP/spctl.txt"
              exit 0
            fi
            cat "$RUNNER_TEMP/spctl.txt"
            echo "attempt $attempt: the notarization ticket is not visible to Gatekeeper yet"
            sleep 15
          done
          exit 1
      - name: A quarantined copy runs
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          copy="$RUNNER_TEMP/quarantined/t3cm"
          mkdir -p "$(dirname "$copy")"
          cp "$BIN" "$copy"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$copy"
          got=$(perl -e 'alarm 60; exec @ARGV' "$copy" --version)
          test "$got" = "t3cm $VERSION"
      - name: Delete the temporary keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          if [ -e "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
      - name: Repackage the signed binary
        working-directory: dist
        env:
          COPYFILE_DISABLE: "1"
        run: tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  checksums:
    name: checksums
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && (needs.sign-macos.result == 'success'
      || (needs.sign-macos.result == 'skipped' && !startsWith(github.ref, 'refs/tags/v'))) }}
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: t3cm-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=(t3cm-*.tar.gz t3cm-*.zip)
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error

  install:
    name: install (${{ matrix.os }})
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    needs: [version, checksums]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: tar.gz }
          - { os: macos-15, target: aarch64-apple-darwin, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: t3cm-${{ needs.version.outputs.version }}-${{ matrix.target }}.${{ matrix.ext }}
      T3CM_RELEASES_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: t3cm-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - name: Serve the archives the way a GitHub Release does
        shell: bash
        run: |
          mkdir -p "srv/download/v$VERSION"
          cp dist/* "srv/download/v$VERSION/"
      - name: Start a systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 30); do
            [ -S "$runtime/bus" ] && break
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Install the latest release (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          python3 .github/scripts/fake_releases.py 8765 srv "v$VERSION" &
          trap 'kill $!' EXIT
          ready=false
          for _ in $(seq 30); do
            if curl -fsSI -o /dev/null http://127.0.0.1:8765/latest; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::the fake release host did not answer on :8765 after 30 tries"
            exit 1
          fi
          deploy/install.sh
      - name: The installed binary runs
        if: runner.os != 'Windows'
        run: test "$("$HOME/.local/bin/t3cm" --version)" = "t3cm $VERSION"
      - name: The installed binary's signature (macOS)
        if: runner.os == 'macOS'
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          bin="$HOME/.local/bin/t3cm"
          codesign --verify --strict --verbose=2 "$bin"
          details=$(codesign --display --verbose=2 "$bin" 2>&1)
          echo "$details"
          if grep -q '^Authority=Developer ID Application: ' <<< "$details"; then
            spctl --assess --type open --context context:primary-signature --verbose=2 "$bin"
          elif [ "$IS_TAG" = true ]; then
            echo "::error::a release install must hold a Developer ID signed binary"
            exit 1
          else
            echo "::notice::the installed binary is not Developer ID signed; this run had no signing secrets"
          fi
      - name: The downloaded install answers t3cm status
        if: runner.os != 'Windows'
        run: |
          for _ in $(seq 30); do
            if "$HOME/.local/bin/t3cm" status; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: The install set up the workflow skills (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          test -f "$HOME/.agents/skills/t3-workflow/SKILL.md"
          "$HOME/.local/bin/t3cm" skills status
      - name: Reinstall from the local archive (Linux, macOS)
        if: runner.os != 'Windows'
        run: deploy/install.sh --archive "dist/$ARCHIVE" --sums dist/SHA256SUMS
      - name: The reinstall kept the workflow skills current (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          "$HOME/.local/bin/t3cm" skills status --json > skills.json || { cat skills.json; exit 1; }
          grep -q "\"installed\": \"$VERSION\"" skills.json
      - name: The systemd unit verifies
        if: runner.os == 'Linux'
        run: systemd-analyze --user verify "$HOME/.config/systemd/user/t3-codemode.service"
      - name: The launchd agent lints
        if: runner.os == 'macOS'
        run: |
          plutil -lint "$HOME/Library/LaunchAgents/com.ottoops.t3-codemode.plist"
          launchctl print "gui/$(id -u)/com.ottoops.t3-codemode" | grep -E 'state|program|path'
      - name: The reinstalled service answers t3cm status
        if: runner.os != 'Windows' && always()
        run: |
          for _ in $(seq 30); do
            if "$HOME/.local/bin/t3cm" status; then exit 0; fi
            sleep 1
          done
          case "$RUNNER_OS" in
            Linux) systemctl --user status t3-codemode --no-pager || true; journalctl --user -u t3-codemode --no-pager || true ;;
            macOS) cat "$HOME/Library/Logs/t3-codemode/"*.log || true ;;
          esac
          exit 1
      - name: Uninstall (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          deploy/install.sh --uninstall
          test ! -e "$HOME/.local/bin/t3cm"
          test ! -e "$HOME/.config/systemd/user/t3-codemode.service"
          test ! -e "$HOME/Library/LaunchAgents/com.ottoops.t3-codemode.plist"
          sleep 2
          if curl -fsS http://127.0.0.1:47731/healthz; then echo "::error::t3cm still serves after uninstall"; exit 1; fi

      - name: Install the latest release (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $srv = Start-Process python -ArgumentList '.github/scripts/fake_releases.py', '8765', 'srv', "v$env:VERSION" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest http://127.0.0.1:8765/latest -Method Head -UseBasicParsing | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'the fake release host did not answer on :8765 after 30 tries' }
            & ./deploy/install.ps1
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }
      - name: The downloaded install answers t3cm status (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\t3-codemode\t3cm.exe"
          for ($i = 0; $i -lt 30; $i++) {
            & $exe status
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 1
          }
          exit 1
      - name: The install set up the workflow skills (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path "$env:USERPROFILE\.agents\skills\t3-workflow\SKILL.md")) { throw 'the t3-workflow skill is not installed' }
          & "$env:LOCALAPPDATA\Programs\t3-codemode\t3cm.exe" skills status
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Reinstall from the local archive (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: '& ./deploy/install.ps1 -Archive "dist/$env:ARCHIVE" -Sums dist/SHA256SUMS'
      - name: The reinstall kept the workflow skills current (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $st = (& "$env:LOCALAPPDATA\Programs\t3-codemode\t3cm.exe" skills status --json) -join "`n"
          if ($LASTEXITCODE -ne 0) { $st; exit 1 }
          if (($st | ConvertFrom-Json).installed -ne $env:VERSION) { throw "the skills record release $(($st | ConvertFrom-Json).installed)" }
      - name: The installed binary runs and the task is registered (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\t3-codemode\t3cm.exe"
          $got = & $exe --version
          if ($got -ne "t3cm $env:VERSION") { throw "t3cm --version printed '$got'" }
          $task = Get-ScheduledTask -TaskName t3-codemode
          $task.Actions[0] | Format-List Execute, Arguments
          $task.Triggers[0].Repetition | Format-List Interval, Duration
          $task.Settings | Format-List ExecutionTimeLimit, MultipleInstances, RestartCount
          if ($task.Actions[0].Execute -ne $exe) { throw "the task runs $($task.Actions[0].Execute)" }
          if ($task.Principal.RunLevel -ne 'Limited') { throw "the task runs elevated" }
      - name: The reinstalled service answers t3cm status (Windows)
        if: runner.os == 'Windows' && always()
        shell: powershell
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\t3-codemode\t3cm.exe"
          for ($i = 0; $i -lt 30; $i++) {
            & $exe status
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 1
          }
          Get-ScheduledTask -TaskName t3-codemode | Get-ScheduledTaskInfo | Format-List
          Get-Content "$env:LOCALAPPDATA\t3-codemode\logs\t3cm.log" -ErrorAction SilentlyContinue
          exit 1
      - name: Uninstall (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./deploy/install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\t3-codemode") { throw 'the install folder is still there' }
          if (Get-ScheduledTask -TaskName t3-codemode -ErrorAction SilentlyContinue) { throw 'the task is still registered' }

  attest:
    name: attest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/SHA256SUMS

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: t3cm-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
            --generate-notes dist/*

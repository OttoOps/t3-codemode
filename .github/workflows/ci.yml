name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Does the change touch the build or the tests
        id: diff
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          files=$(git diff --name-only --no-renames "$BASE" HEAD)
          code=false
          while IFS= read -r path; do
            case "$path" in
              docs/*|deploy/*|.github/*|LICENSE|.coderabbit.yaml|.gitignore) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          printf '%s\n' "$files"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  platform:
    name: check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release --locked
      - if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s tests/skills -v

  check:
    needs: [changes, platform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every platform passed, or the change needs none
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.platform.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then
            test "$RESULT" = success
          else
            test "$RESULT" = skipped
          fi

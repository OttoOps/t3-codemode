name: mutants-diff

on:
  pull_request:
    paths:
      - "src/**.rs"
      - .cargo/mutants.toml
      - .github/workflows/mutants-diff.yml
      - .github/scripts/mutants-scope.py
      - .github/scripts/mutants-summary.sh

permissions:
  contents: read

concurrency:
  group: mutants-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

jobs:
  mutants:
    name: mutants (diff, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Diff against the PR base
        id: scope
        run: |
          git diff --no-ext-diff --no-color --src-prefix=a/ --dst-prefix=b/ HEAD^1 HEAD >pr.diff
          files=$(git diff --name-only --no-renames HEAD^1 HEAD | python3 .github/scripts/mutants-scope.py .cargo/mutants.toml)
          if [ -z "$files" ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            {
              echo "## Diff mutation grading"
              echo
              echo "No file in \`.cargo/mutants.toml\` changed, so no mutants ran."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "$files"
          echo "run=true" >>"$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable as of 2026-10-16
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: stable
      - name: Install mold
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: steps.scope.outputs.run == 'true'
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.run == 'true'
        with:
          key: chaos-mutants-diff
      - name: Grade the mutants in the diff
        id: grade
        if: steps.scope.outputs.run == 'true'
        run: |
          mkdir -p mutants-diff
          set +e
          cargo mutants --in-place --in-diff pr.diff --output mutants-diff
          code=$?
          set -e
          case $code in
            0|2|3) ;;
            *) echo "cargo-mutants exited $code"; exit "$code" ;;
          esac
      - name: Job summary
        if: steps.grade.outcome == 'success'
        run: |
          .github/scripts/mutants-summary.sh mutants-diff mutants-diff-summary diff
          cat mutants-diff-summary/summary.md >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.grade.outcome == 'success'
        with:
          name: mutants-diff
          path: mutants-diff-summary/
          if-no-files-found: ignore
          retention-days: 14

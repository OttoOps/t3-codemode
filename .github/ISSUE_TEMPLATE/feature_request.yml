name: Feature request
description: Propose a change and explain the problem it would solve.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a request, and link related work
        below.

        `t3cm` stays a local, single-user service in front of T3 Code.
        Proposals that expose it beyond loopback by default, weaken the
        sandbox limits, or let `execute` code reach the filesystem, the
        network or the T3 token directly are out of scope. See the
        [contribution guide](https://github.com/OttoOps/t3-codemode/blob/main/.github/CONTRIBUTING.md).
        Participation follows the [Code of Conduct](https://github.com/OttoOps/t3-codemode/blob/main/.github/CODE_OF_CONDUCT.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you want and how you would use it. Include example `execute` code, a config snippet, or a board interaction if it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any current workaround and its limitations.
  - type: textarea
    id: related
    attributes:
      label: Related issues
      description: Link any existing discussion or issue.

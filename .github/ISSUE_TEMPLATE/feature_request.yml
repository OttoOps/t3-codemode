name: Feature request
description: Propose a change and explain the problem it would solve.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a request, and link related work
        below.

        `t3cm` stays a local, single-user service in front of T3 Code.
        Proposals that expose it beyond loopback by default, weaken the
        sandbox limits, or let `execute` code reach the filesystem, the
        network or the T3 token directly are out of scope. See the
        [contribution guide](https://github.com/OttoOps/t3-codemode/blob/main/.github/CONTRIBUTING.md).
        Participation follows the [Code of Conduct](https://github.com/OttoOps/t3-codemode/blob/main/.github/CODE_OF_CONDUCT.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you want and how you would use it. Include example `execute` code, a config snippet, or a board interaction if it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any current workaround and its limitations.
  - type: textarea
    id: related
    attributes:
      label: Related issues
      description: Link any existing discussion or issue.
  - type: markdown
    attributes:
      value: |
        ### Flow metadata (optional)
        These optional fields match the canonical `## Flow` block (`Parent`, `Blocked by`, `Track`, `Priority`, `Touches`) that `t3cm` parses into the dependency graph and can sync to native GitHub links from the board. Leave any field blank if it does not apply.
  - type: input
    id: flow_parent
    attributes:
      label: Parent / Epic
      description: Parent epic issue for `## Flow` (`Parent:`), such as `#254` or `owner/repo#254`.
      placeholder: "#254"
  - type: input
    id: flow_blocked_by
    attributes:
      label: Blocked by
      description: Issues that must land first for `## Flow` (`Blocked by:`), comma-separated.
      placeholder: "#255, owner/repo#12"
  - type: input
    id: flow_track
    attributes:
      label: Track
      description: Flow swimlane slug for `## Flow` (`Track:`).
      placeholder: "flow-dag"
  - type: input
    id: flow_touches
    attributes:
      label: Affected files
      description: Repo-relative paths this work touches for `## Flow` (`Touches:`), comma-separated.
      placeholder: "src/web.rs, src/board.html"

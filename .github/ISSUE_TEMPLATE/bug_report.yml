name: Bug report
description: Report unexpected behavior with a reproducible example.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Report suspected vulnerabilities through
        [private vulnerability reporting](https://github.com/OttoOps/t3-codemode/security/advisories/new),
        not this public form. See the [security policy](https://github.com/OttoOps/t3-codemode/security/policy).

        Search existing issues first. Remove tokens, pairing codes,
        machine-specific absolute paths, and personal data from scripts and
        logs before posting them.
        Participation follows the [Code of Conduct](https://github.com/OttoOps/t3-codemode/blob/main/.github/CODE_OF_CONDUCT.md).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release tag or commit are you running? `t3cm status` prints the version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your OS, the T3 Code version, how you installed t3cm, the MCP client calling it (for example Claude Code), and any upstream MCP servers configured.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest `execute` or `search` code, board action, or config that reproduces the problem. Use made-up names and content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the tool result or error text, the HTTP status, or the exit code.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: For example `journalctl --user -u t3-codemode`. Remove tokens, absolute paths that identify your machine, and any private thread content.
      render: text
  - type: markdown
    attributes:
      value: |
        ### Flow metadata (optional)
        These optional fields match the canonical `## Flow` block (`Parent`, `Blocked by`, `Track`, `Priority`, `Touches`) that `t3cm` parses into the dependency graph and can sync to native GitHub links from the board. Leave any field blank if it does not apply.
  - type: input
    id: flow_parent
    attributes:
      label: Parent / Epic
      description: Parent epic issue for `## Flow` (`Parent:`), such as `#254` or `owner/repo#254`.
      placeholder: "#254"
  - type: input
    id: flow_blocked_by
    attributes:
      label: Blocked by
      description: Issues that must land first for `## Flow` (`Blocked by:`), comma-separated.
      placeholder: "#255, owner/repo#12"
  - type: input
    id: flow_track
    attributes:
      label: Track
      description: Flow swimlane slug for `## Flow` (`Track:`).
      placeholder: "flow-dag"
  - type: input
    id: flow_touches
    attributes:
      label: Affected files
      description: Repo-relative paths this fix is likely to touch for `## Flow` (`Touches:`), comma-separated.
      placeholder: "src/web.rs, src/board.html"

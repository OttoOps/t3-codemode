<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t3 board, glance mockup</title>
<style>
:root {
  --canvas: #f3f3ef;
  --panel: #ffffff;
  --panel-2: #f7f7f4;
  --raise: #ffffff;
  --line: #d6d6cf;
  --line-strong: #b9b9b1;
  --field: #8c9096;
  --ink: #1b1d20;
  --ink-2: #565b62;
  --ink-3: #6a6f76;
  --accent: #2f5bd3;
  --accent-ink: #ffffff;
  --accent-soft: #e4ebfb;
  --go: #2f5bd3;
  --go-hover: #2549b0;
  --need: #8a4f00;
  --need-fill: #f2b450;
  --need-fill-ink: #2a1a00;
  --need-soft: #fbf0dd;
  --run: #1b1d20;
  --fail: #a52a22;
  --done: #24663d;
  --dec-surface: #fbf7ef;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0f1113;
    --panel: #181b1f;
    --panel-2: #1d2125;
    --raise: #22262b;
    --line: #2c3137;
    --line-strong: #4a515a;
    --field: #7d848c;
    --ink: #eceef0;
    --ink-2: #a9aeb5;
    --ink-3: #9198a0;
    --accent: #86a5f7;
    --accent-ink: #0f1420;
    --accent-soft: #232c45;
    --go: #3b62d6;
    --go-hover: #2c50bd;
    --need: #f0b45e;
    --need-fill: #f0b45e;
    --need-fill-ink: #1f1400;
    --need-soft: #33291a;
    --run: #eceef0;
    --fail: #f2948a;
    --done: #7fcf9b;
    --dec-surface: #1c1a17;
  }
}
:root[data-theme="dark"] {
  --canvas: #0f1113;
  --panel: #181b1f;
  --panel-2: #1d2125;
  --raise: #22262b;
  --line: #2c3137;
  --line-strong: #4a515a;
  --field: #7d848c;
  --ink: #eceef0;
  --ink-2: #a9aeb5;
  --ink-3: #9198a0;
  --accent: #86a5f7;
  --accent-ink: #0f1420;
  --accent-soft: #232c45;
  --go: #3b62d6;
  --go-hover: #2c50bd;
  --need: #f0b45e;
  --need-fill: #f0b45e;
  --need-fill-ink: #1f1400;
  --need-soft: #33291a;
  --run: #eceef0;
  --fail: #f2948a;
  --done: #7fcf9b;
  --dec-surface: #1c1a17;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--canvas); color: var(--ink);
  font: 400 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-rows: 48px 44px 1fr;
}
::selection { background: var(--accent); color: var(--accent-ink); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
h1, h2, p, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button, input, textarea { font: inherit; color: inherit; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.meta { color: var(--ink-2); font-size: 13px; line-height: 18px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 28px; padding: 0 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
  font-size: 13px; line-height: 18px; font-weight: 500;
}
.btn.text { border-color: transparent; color: var(--ink-2); padding: 0 8px; }
.btn.go { background: var(--go); border-color: var(--go); color: #fff; font-weight: 600; }
.btn.answer { height: 32px; padding: 0 16px; background: var(--go); border-color: var(--go); color: #fff; font-weight: 600; font-size: 14px; }
.btn svg { width: 16px; height: 16px; flex: none; }

.st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.st svg { width: 12px; height: 12px; flex: none; }
.st.need { color: var(--need); }
.st.run { color: var(--run); }
.st.wait, .st.idle { color: var(--ink-2); font-weight: 500; }
.st.fail { color: var(--fail); }
.st.done { color: var(--done); }

header {
  display: flex; align-items: center; gap: 16px; padding: 0 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 16px; line-height: 20px; font-weight: 600; }
.conn { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.sum { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--ink-2); }
.sum b { color: var(--ink); font-weight: 600; }
.sum .needc { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 8px; border-radius: 10px; background: var(--need-fill); color: var(--need-fill-ink); font-size: 12px; font-weight: 600; }
.hbtns { display: flex; gap: 8px; }

.fbar { display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.fbar input { width: 280px; height: 28px; border: 1px solid var(--field); border-radius: 6px; background: var(--canvas); color: var(--ink); padding: 0 8px; font-size: 13px; }
.fbar input::placeholder { color: var(--ink-3); }
.fbar .btn svg { width: 12px; height: 12px; }

main { display: grid; grid-template-columns: 440px minmax(0, 1fr) 380px; min-height: 0; }
.pane { display: grid; grid-template-rows: 48px 1fr; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
.pane:last-child { border-right: 0; }
.ph { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.ph h2 { font-size: 16px; line-height: 20px; font-weight: 600; }
.ph .cnt { color: var(--ink-2); font-size: 13px; font-weight: 500; }
.scroll { overflow: auto; min-height: 0; }

#p-dec { background: var(--dec-surface); }
#p-dec .ph { border-bottom-color: var(--line-strong); }
.cards { padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
.card {
  background: var(--raise); border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0;
}
.card .ask { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--ink);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .ask .kindw { color: var(--fail); }
.card .ask .kindw.rep { color: var(--ink-2); }
.card .ask .st { vertical-align: -1px; }
.card .ctx { display: flex; gap: 8px; align-items: baseline; color: var(--ink-2); font-size: 13px; line-height: 18px; min-width: 0; }
.card .ctx .lab { color: var(--ink); font-weight: 500; flex: none; }
.card .ctx .age { margin-left: auto; flex: none; }
.card .detail { color: var(--ink-2); font-size: 13px; line-height: 18px; }
.card .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; min-width: 0; }
.card .acts .sp { margin-left: auto; }
.card .acts .quiet { display: flex; gap: 0; }
.card .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.card .rev { font-size: 13px; white-space: nowrap; }
.card.k-blocker { border-color: var(--fail); }
.card .sending { display: inline-flex; align-items: center; height: 32px; font-size: 13px; font-weight: 600; color: var(--ink); }
.btn.undo { height: 32px; border-color: var(--accent); color: var(--accent); font-weight: 600; }

html.sheet, html.sheet body { overflow: auto; height: auto; }
html.sheet body { display: block; padding: 24px; }
html.sheet main, html.sheet header, html.sheet .fbar, html.sheet .ctoggle, html.sheet .tabbar { display: none !important; }
.sheetwrap { display: grid; gap: 24px; max-width: 1180px; }
.sheetwrap > section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sheetwrap > section > h2 { font-size: 16px; line-height: 20px; font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheetwrap .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; padding: 16px; background: var(--dec-surface); }
.sheetwrap figure { margin: 0; display: grid; gap: 8px; align-content: start; }
.sheetwrap figcaption { font-size: 12px; line-height: 16px; color: var(--ink-2); font-weight: 500; }
.sheetwrap .rows { display: grid; grid-template-columns: minmax(0, 1fr); }
.sheetwrap .cap { padding: 8px 16px 0; font-size: 12px; line-height: 16px; color: var(--ink-2); font-weight: 500; }

.tabs { display: flex; align-self: stretch; gap: 16px; margin-left: 16px; }
.tab { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; padding-top: 2px; }
.tab b { font-weight: 500; color: var(--ink-3); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab[aria-selected="true"] b { color: var(--ink-2); }
.thead { display: grid; grid-template-columns: 24px minmax(0, 1fr) 72px; gap: 8px; padding: 8px 16px; font-size: 12px; line-height: 16px; color: var(--ink-3); font-weight: 500; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.thead span:last-child { text-align: right; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) 72px; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.tgroup { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--line); background: var(--panel-2); }
.tgroup .num { color: var(--ink-2); font-weight: 500; }
.trow .mk { padding-top: 2px; }
.trow .mk svg { width: 14px; height: 14px; }
.trow .t1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.trow .lab { font-weight: 600; flex: none; }
.trow .title { color: var(--ink); }
.trow .t2 { display: flex; gap: 8px; align-items: baseline; min-width: 0; margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.trow .t2 .st { flex: none; }
.trow .t2 a.needlink { color: var(--need); font-weight: 600; flex: none; }
.trow .ws { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.trow .w { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.trow .w .pr { color: var(--accent); }
.trow .w.collapsed { color: var(--ink-2); }
.trow .age { text-align: right; font-size: 13px; color: var(--ink-2); padding-top: 1px; }

#p-right { grid-template-rows: auto 48px 1fr; }
.composer { padding: 12px 16px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.composer .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.composer textarea, .composer input { width: 100%; border: 1px solid var(--field); border-radius: 6px; background: var(--canvas); color: var(--ink); padding: 4px 8px; font-size: 14px; line-height: 20px; resize: none; }
.composer input { height: 32px; }
.composer textarea::placeholder, .composer input::placeholder { color: var(--ink-3); }
.composer .btn { height: 32px; }
.composer label { font-size: 13px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 4px; }
#p-right .ph { border-top: 0; }
.feed li { padding: 8px 16px; border-bottom: 1px solid var(--line); }
.feed .f1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; font-size: 13px; line-height: 18px; }
.feed .f1 .who { font-weight: 600; color: var(--ink); }
.feed .f1 .sub { color: var(--ink-2); }
.feed .f1 .age { margin-left: auto; color: var(--ink-2); flex: none; }
.feed .msg { font-size: 13px; line-height: 18px; color: var(--ink); margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.feed .more { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.feed .ev { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 12px; font-weight: 500; flex: none; }

.tabbar, .ctoggle { display: none; }
@media (max-width: 1279px) {
  main { grid-template-columns: 360px minmax(0, 1fr) 320px; }
}
@media (max-width: 999px) {
  body { grid-template-rows: 48px 1fr auto auto; }
  .fbar { display: none; }
  .sum .runc, .hbtns .btn span, .conn span, .needc .w { display: none; }
  header { gap: 8px; padding: 0 12px; }
  .sum { gap: 8px; }
  .hbtns .btn { padding: 0 8px; }
  main { grid-template-columns: 1fr; }
  .pane { border-right: 0; }
  .pane:not(.on) { display: none; }
  #p-right { grid-template-rows: 48px 1fr; }
  #p-right .composer { display: none; }
  .ctoggle { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  .ctoggle input { height: 44px; border: 1px solid var(--field); border-radius: 6px; background: var(--canvas); color: var(--ink); padding: 0 12px; font-size: 16px; }
  .ctoggle input::placeholder { color: var(--ink-3); }
  .ctoggle .btn { height: 44px; }
  .seg { display: flex; }
  .seg button { height: 44px; min-width: 52px; padding: 0 8px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-left: 0; border-radius: 0 6px 6px 0; }
  .seg button[aria-selected="true"] { background: var(--raise); color: var(--ink); font-weight: 600; }
  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border-top: 1px solid var(--line); }
  .tabbar a { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; color: var(--ink-2); font-size: 13px; font-weight: 500; border-top: 2px solid transparent; }
  .tabbar a.on { color: var(--ink); border-top-color: var(--ink); font-weight: 600; }
  .cards { padding: 8px; gap: 8px; }
  .card { padding: 12px; }
  .trow { padding: 12px; grid-template-columns: 20px minmax(0, 1fr) 56px; }
  .thead { display: none; }
  .trow .t1 { flex-wrap: wrap; row-gap: 0; }
  .trow .title { flex-basis: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>t3 board</h1>
  <span class="conn" title="Live, checked just now"><i></i><span>Live, checked just now</span></span>
  <div class="sum">
    <span class="needc"><span class="pill num" id="h-need"></span><span class="w">need you</span></span>
    <span class="runc"><b class="num" id="h-run"></b> workers running</span>
    <div class="hbtns">
      <button class="btn" type="button" aria-label="Notifications off"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3z"/><path d="M6.5 14h3"/><path d="M2 2l12 12"/></svg><span>Notifications off</span></button>
      <button class="btn" type="button" aria-label="Shortcuts"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="4" width="13" height="8" rx="1.5"/><path d="M4 7h1M7 7h2M11 7h1M5 9.5h6"/></svg><span>Shortcuts</span></button>
    </div>
  </div>
</header>
<div class="fbar" role="search">
  <input type="search" placeholder="Search tickets, cards and activity">
  <button class="btn text" type="button">Project <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5l3 3 3-3"/></svg></button>
  <button class="btn text" type="button">Status <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5l3 3 3-3"/></svg></button>
  <button class="btn text" type="button">Card kind <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4.5l3 3 3-3"/></svg></button>
</div>
<main>
  <section class="pane" id="p-dec">
    <div class="ph"><h2>Needs you</h2><span class="pill num" id="dec-n"></span></div>
    <div class="scroll"><div class="cards" id="cards"></div></div>
  </section>
  <section class="pane" id="p-tix">
    <div class="ph"><h2>Tickets</h2>
      <div class="tabs" id="tix-tabs" role="tablist">
        <span class="tab" role="tab" aria-selected="true">Open <b class="num" id="n-open"></b></span>
        <span class="tab" role="tab">Done <b class="num">0</b></span>
        <span class="tab" role="tab">Settled <b class="num" id="n-set"></b></span>
      </div>
    </div>
    <div class="scroll">
      <ol id="open"></ol>
    </div>
  </section>
  <section class="pane" id="p-right">
    <div class="composer">
      <div><label for="issues">Launch tickets</label>
        <div class="row"><textarea id="issues" rows="2" placeholder="owner/repo#41 or an issue URL, one per line"></textarea><button class="btn go" type="button">Launch</button></div></div>
      <div><label for="question">Ask about the board</label>
        <div class="row"><input id="question" type="text" placeholder="Which tickets wait on me, and why?"><button class="btn go" type="button">Ask</button></div></div>
    </div>
    <div class="ph"><h2>Activity</h2><span class="cnt num" id="n-feed"></span></div>
    <div class="scroll"><ol class="feed" id="feed"></ol></div>
  </section>
</main>
<div class="ctoggle">
  <div class="seg" role="tablist" aria-label="Composer"><button type="button" role="tab" aria-selected="true" data-m="launch">Launch</button><button type="button" role="tab" aria-selected="false" data-m="ask">Ask</button></div>
  <input type="text" id="c-in" aria-label="Issues to launch" placeholder="owner/repo#41 or an issue URL"><button class="btn go" type="button" id="c-go">Launch</button>
</div>
<nav class="tabbar">
  <a href="#" role="tab" id="tab-dec" data-p="p-dec" class="on">Needs you <span class="pill num" id="tb-need"></span></a>
  <a href="#" role="tab" id="tab-tix" data-p="p-tix">Tickets <span class="num" id="tb-tix"></span></a>
  <a href="#" role="tab" id="tab-act" data-p="p-right">Activity</a>

}

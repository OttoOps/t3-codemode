<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair browser - t3cm board</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --fg: #181a1f;
    --muted: #5a6270;
    --border: #d8dde6;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --err-bg: #fef2f2;
    --err-fg: #991b1b;
    --err-border: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --fg: #e7eaf0;
      --muted: #98a2b3;
      --border: #2a303c;
      --accent: #2563eb;
      --accent-fg: #ffffff;
      --err-bg: #2c1416;
      --err-fg: #fca5a5;
      --err-border: #7f1d1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  h1 { margin: 0 0 8px; font-size: 19px; font-weight: 600; }
  p { margin: 0 0 16px; color: var(--muted); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 4px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
  }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 10px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-fg);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .err {
    margin: 0 0 14px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--err-border);
    background: var(--err-bg);
    color: var(--err-fg);
    font-size: 14px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Pair this browser</h1>
  <p id="status">Run <code>t3cm board pair</code> on the host and open the link or paste it below.</p>
  <div id="err" class="err" role="alert" hidden></div>
  <form id="pair-form" novalidate>
    <label for="token">Pairing URL or token</label>
    <input id="token" name="token" type="password" autocomplete="off" spellcheck="false" required>
    <label for="label">Device label (optional)</label>
    <input id="label" name="label" type="text" maxlength="80" placeholder="Phone, laptop, ...">
    <button id="submit" type="submit">Pair browser</button>
  </form>
</main>
<script>
(() => {
  const statusEl = document.getElementById("status");
  const errEl = document.getElementById("err");
  const form = document.getElementById("pair-form");
  const tokenInput = document.getElementById("token");
  const labelInput = document.getElementById("label");
  const submitBtn = document.getElementById("submit");

  function extractToken(raw) {
    const s = String(raw || "").trim();
    const idx = s.indexOf("#");
    return (idx >= 0 ? s.slice(idx + 1) : s).trim();
  }

  function showError(msg) {
    errEl.textContent = msg;
    errEl.hidden = false;
  }

  async function redeem(token, label) {
    errEl.hidden = true;
    submitBtn.disabled = true;
    statusEl.textContent = "Pairing this browser...";
    try {
      const payload = label ? { token, label } : { token };
      const res = await fetch("/api/pair", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        statusEl.textContent = "Paired. Opening the board...";
        location.replace("/");
        return;
      }
      let msg = "Pairing failed (" + res.status + ").";
      try {
        const data = await res.json();
        if (data && typeof data.error === "string") msg = data.error;
      } catch (_) {}
      showError(msg);
      statusEl.textContent = "Run t3cm board pair on the host to mint a fresh link.";
      form.hidden = false;
    } catch (_) {
      showError("Could not reach the board to complete pairing.");
      form.hidden = false;
    } finally {
      submitBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const token = extractToken(tokenInput.value);
    if (!token) {
      showError("Paste a pairing URL or token first.");
      tokenInput.focus();
      return;
    }
    const label = labelInput.value.trim();
    tokenInput.value = "";
    redeem(token, label || undefined);
  });

  const frag = extractToken(location.hash);
  if (location.hash) {
    try { history.replaceState(null, "", location.pathname); } catch (_) {}
  }
  if (frag) {
    form.hidden = true;
    redeem(frag, undefined);
  }
})();
</script>
</body>
</html>
